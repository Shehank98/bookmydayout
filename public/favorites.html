<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My favorites — BookMyDayOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="header"></div>

  <div class="container section">
    <div class="section-head"><h2>My favorites</h2></div>
    <div id="fav-results"><div class="spinner"></div></div>
  </div>

  <div id="footer"></div>

  <script src="/js/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    (async () => {
      const box = document.getElementById('fav-results');
      const user = await Auth.requireUser();
      if (!user) return;
      try {
        const { data } = await API.get('/me/favorites');
        box.innerHTML = data.length
          ? `<div class="grid grid-listings">${data.map(BMD.listingCard).join('')}</div>`
          : '<div class="empty">No favorites yet. Browse listings and tap ♡ to save them.</div>';
      } catch (e) {
        box.innerHTML = '<div class="empty">Could not load favorites.</div>';
      }
    })();
  </script>
</body>
</html>
